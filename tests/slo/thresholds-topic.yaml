# Per-scenario SLO thresholds for the topic workloads, merged OVER the action's
# global deploy/thresholds.yaml for topic runs only (via the init action's
# `thresholds_yaml_path` input — see ydb-slo-action PR #57 "per-scenario
# threshold overrides"). On an action version without that feature this file is
# simply ignored, so wiring it is harmless and self-activates once it lands.
#
# What's made `direction: neutral` (visible in the report, but never warns/fails):
#
# - read_latency_* — for topics this is `receive_message` wait time (inter-message
#   gap / prefetch drain), NOT a read cost; the meaningful read-side latency is
#   the custom `topic_e2e_latency_*`.
#
# - *_p99 tails (write + e2e) — under chaos the p99 is dominated by node-kill
#   outage spikes, and for async it also carries single-event-loop scheduling
#   jitter; both are uncorrelated between the current and baseline containers, so
#   the p99 current-vs-baseline delta is noise, not a regression signal.
#
# Kept gated (strict global thresholds): write_latency p50/p95 (ack round-trip),
# topic_e2e_latency_p50 (the real delivery latency), topic_delivered_rps,
# topic_lost_errors, read/write availability. table/query are untouched.

metrics:
  - name: read_latency_p50_ms
    direction: neutral
  - name: read_latency_p95_ms
    direction: neutral
  - name: read_latency_p99_ms
    direction: neutral
  - name: write_latency_p99_ms
    direction: neutral
  - name: topic_e2e_latency_p99_ms
    direction: neutral

  # Retry attempts: keep the absolute gate, drop the relative comparison.
  #
  # The metric is zero almost everywhere and spikes only in the seconds around a chaos fault.
  # Comparing two such series relatively divides one accidental spike by another: across two runs
  # this flagged sync-table (▲50%, sums 12 vs 14) and then async-topic (▲450%, sums 75 vs 12),
  # each time from 2 non-zero samples out of 120, with the report's own `concordance` at 0.008 --
  # i.e. the two series almost never have data at the same moment. Whichever workload draws the
  # bigger spike gets marked red, which is noise, not a regression signal.
  #
  # `direction: neutral` disables exactly the relative check (evaluateRelativeThreshold only ever
  # flags `lower_is_better` / `higher_is_better`), while the absolute check still runs for both
  # bounds. `warning_max` is restated on purpose: findMatchingThreshold returns the FIRST matching
  # entry whole and an exact `name` beats a `pattern`, so this entry replaces the action's
  # `*_attempts` default rather than merging with it -- omit it and the "retries must stay at
  # zero" gate silently disappears along with the noise.
  - name: read_retry_attempts
    direction: neutral
    warning_max: 0.0
  - name: write_retry_attempts
    direction: neutral
    warning_max: 0.0
